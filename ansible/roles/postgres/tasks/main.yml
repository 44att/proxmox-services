- name: Create backup cron job for lidarr-main database
  cron:
    user: postgres
    name: backup lidarr-main database
    minute: "0"
    hour: "2"
    job: 'pg_dump -U postgres -F c lidarr-main > /mnt/app_config/postgres/backups/lidarr/lidarr-main-$(date +\%Y\%m\%d).dump && find /mnt/app_config/postgres/backups/lidarr -name "lidarr-main-*.dump" -mtime +7 -delete'

