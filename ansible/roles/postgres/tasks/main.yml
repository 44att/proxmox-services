---
- name: Create Postgres group
  group:
    name: postgres
    gid: 10000
    state: present

- name: Create Postgres user
  user:
    name: postgres
    uid: 1000
    groups: postgres
    shell: /bin/zsh
    append: true
    state: present
    create_home: true

- name: Install packages
  apt:
    pkg:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: latest
  notify:
    - Start Postgres

- name: Copy .oh-my-zsh from root user
  copy:
    src: /root/.oh-my-zsh/
    dest: /home/postgres/.oh-my-zsh/
    owner: postgres
    group: postgres
    remote_src: true

- name: Set correct permissions for oh-my-zsh files
  file:
    path: /home/postgres/.oh-my-zsh/
    owner: postgres
    group: postgres
    mode: u=rwX,g=rX,o=rX
    recurse: true

- name: Create .zshrc file
  copy:
    src: /root/.zshrc
    dest: /home/postgres/.zshrc
    owner: postgres
    group: postgres
    mode: 0644
    remote_src: true

- name: Replace root with postgres in .zshrc
  lineinfile:
    path: /home/postgres/.zshrc
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: export DEFAULT_USER="root", line: export DEFAULT_USER="postgres" }
    - { regexp: export ZSH=/root/.oh-my-zsh, line: export ZSH=/home/postgres/.oh-my-zsh }

- name: Set password for default postgres user 
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ tf_postgres_database_password }}"
  environment:
    PGOPTIONS: "-c password_encryption=scram-sha-256"
  become: true
  become_user: postgres

- name: Create users
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
  environment:
    PGOPTIONS: "-c password_encryption=scram-sha-256"
  become: true
  become_user: postgres
  loop: 
    - { name: lidarr, password: "{{ tf_lidarr_database_password }}" }
    - { name: radarr, password: "{{ tf_radarr_database_password }}" }
    - { name: sonarr, password: "{{ tf_sonarr_database_password }}" }
    - { name: prowlarr, password: "{{ tf_prowlarr_database_password }}" }
    - { name: bazarr, password: "{{ tf_bazarr_database_password }}" }
    - { name: seerr, password: "{{ tf_seerr_database_password }}" }
    - { name: donetick, password: "{{ tf_donetick_database_password }}" }
  notify:
    - Start Postgres

- name: Create databases
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    comment: "{{ item.comment }}"
    encoding: "UTF-8"
  become: true
  become_user: postgres
  loop:
    - { name: lidarr-main, owner: lidarr, comment: 'Lidarr main database' }
    - { name: lidarr-log, owner: lidarr, comment: 'Lidarr logs database' }
    - { name: radarr-main, owner: radarr, comment: 'Radarr main database' }
    - { name: radarr-log, owner: radarr, comment: 'Radarr logs database' }
    - { name: sonarr-main, owner: sonarr, comment: 'Sonarr main database' }
    - { name: sonarr-log, owner: sonarr, comment: 'Sonarr logs database' }
    - { name: prowlarr-main, owner: prowlarr, comment: 'Prowlarr main database' }
    - { name: prowlarr-log, owner: prowlarr, comment: 'Prowlarr logs database' }
    - { name: seerr, owner: seerr, comment: 'Seerr database' }
    - { name: bazarr, owner: bazarr, comment: 'Bazarr database' }
    - { name: donetick, owner: donetick, comment: 'Donetick database' }
  notify:
    - Start Postgres

- name: Update postgresql.conf file
  lineinfile:
    path: /etc/postgresql/18/main/postgresql.conf
    regexp: "#listen_addresses = 'localhost'"
    line: listen_addresses = '*'
  notify:
    - Start Postgres

- name: Test for lidarr main line in pg_hba.conf
  shell: grep -c "lidarr-main" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_lidarr_main

- name: Test for lidarr log line in pg_hba.conf
  shell: grep -c "lidarr-log" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_lidarr_log

- name: Test for radarr main line in pg_hba.conf
  shell: grep -c "radarr-main" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_radarr_main

- name: Test for radarr log line in pg_hba.conf
  shell: grep -c "radarr-log" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_radarr_log

- name: Test for sonarr main line in pg_hba.conf
  shell: grep -c "sonarr-main" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_sonarr_main

- name: Test for sonarr log line in pg_hba.conf
  shell: grep -c "sonarr-log" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_sonarr_log

- name: Test for prowlarr main line in pg_hba.conf
  shell: grep -c "prowlarr-main" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_prowlarr_main

- name: Test for prowlarr log line in pg_hba.conf
  shell: grep -c "prowlarr-log" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_prowlarr_log

- name: Test for bazarr line in pg_hba.conf
  shell: grep -c "bazarr" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_bazarr

- name: Test for seerr line in pg_hba.conf
  shell: grep -c "seerr" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_seerr

- name: Test for donetick line in pg_hba.conf
  shell: grep -c "donetick" /etc/postgresql/18/main/pg_hba.conf || true
  register: test_donetick

- name: Add lidarr main access to pg_hba.conf
  lineinfile:
    dest: /etc/postgresql/18/main/pg_hba.conf
    line: "host  lidarr-main  lidarr  {{ tf_lidarr_ip }}/24  scram-sha-256"
  when: test_lidarr_main.stdout == "0"
  notify:
    - Start Postgres

